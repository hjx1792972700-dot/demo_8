<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>蜘蛛纸牌游戏</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="game-container">
        <!-- 顶部状态栏 -->
        <div class="top-bar">
            <div class="difficulty-selector">
                <label for="difficulty">难度：</label>
                <select id="difficulty">
                    <option value="1">1 花色</option>
                    <option value="2">2 花色</option>
                    <option value="4" selected>4 花色</option>
                </select>
                <button id="new-game">新游戏</button>
            </div>
            <div class="status">
                <span id="moves">步数: 0</span>
                <span id="timer">时间: 00:00</span>
                <button id="undo">撤销</button>
            </div>
        </div>
        
        <!-- 游戏区域 -->
        <div class="game-area">
            <div class="columns" id="columns">
                <!-- 10列牌堆将由JS生成 -->
            </div>
            <div class="stock-pile" id="stock-pile">
                <!-- 发牌堆 -->
                <div class="card back" id="stock-card"></div>
            </div>
        </div>
        
        <!-- 拖拽时的卡牌容器 -->
        <div class="drag-container" id="drag-container"></div>
    </div>
    
    <script src="script.js"></script>
</body>
</html>
